name: Notify on BYU game start and final

# GitHub throttles this cron to roughly every 3-7h. That's fine: a run that
# lands within 12h of kickoff stays running and polls every minute, then
# re-dispatches itself until the game is final (see scripts/notify.py).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# Never run two watchers at once (would double-notify). Extra triggers queue.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Watch for kickoff/final and notify
        id: watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_MBB: ${{ secrets.NTFY_TOPIC_MBB }}
          NTFY_TOPIC_JAZZ: ${{ secrets.NTFY_TOPIC_JAZZ }}
        run: uv run python scripts/notify.py

      - name: Commit updated notification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/notified.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notified games state"
            git pull --rebase
            git push
          fi

      - name: Continue watching in a fresh run
        if: steps.watch.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notify.yml --ref "${{ github.ref_name }}"
